{% load bootstrap4 %}
{% load static %}
<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar Produto</title>

  <!-- Bootstrap 4 CDN (opcional - remova se já estiver carregado globalmente) -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    :root{
      --bg-1: #f6f8fb;
      --card-bg: #ffffff;
      --accent: #0d6efd;
      --muted: #6c757d;
      --max-width: 720px;
      --radius: 12px;
    }

    html,body{height:100%;background:var(--bg-1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;margin:0;padding:0;color:#222}

    .page-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}

    .edit-card{width:100%;max-width:var(--max-width);background:var(--card-bg);border-radius:var(--radius);box-shadow:0 10px 30px rgba(16,24,40,0.06);overflow:hidden;border:1px solid rgba(16,24,40,0.04)}

    .edit-card .card-header{padding:1.25rem 1.75rem;background:linear-gradient(90deg,#fff,#fbfdff);display:flex;align-items:center;justify-content:space-between}
    .title{font-size:1.125rem;font-weight:700}
    .subtitle{color:var(--muted);font-size:0.9rem}

    .card-body{padding:1.5rem}

    .form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
    .form-group{margin-bottom:0.9rem}

    label{font-weight:600;font-size:0.95rem}
    .form-control{border-radius:8px;padding:.6rem .75rem}

    /* full-width single column on small screens */
    @media (max-width:720px){
      .form-row{grid-template-columns:1fr}
    }

    .actions{display:flex;gap:0.75rem;margin-top:1rem}
    .btn-primary{min-width:140px;border-radius:10px}
    .btn-outline{min-width:140px;border-radius:10px}

    .note{font-size:0.9rem;color:var(--muted);margin-top:0.5rem}

    /* pequeno helper para preço */
    .input-group .input-group-text{border-radius:8px}

  </style>
</head>

<body>
  <div class="page-wrap">
    <div class="edit-card">

      <div class="card-header">
        <div>
          <div class="title">Editar Produto</div>
          <div class="subtitle">Atualize os dados do produto e clique em salvar.</div>
        </div>
        <div class="subtitle">ID: {{ produto.id }}</div>
      </div>

      <div class="card-body">
        <form action="{% url 'url_editar_produto' produto.id %}" method="POST" class="mb-0">
          {% csrf_token %}

          <div class="form-row">
            <div class="form-group">
              <label for="nameInput">Nome</label>
              <input type="text" class="form-control" id="nameInput" name="nome" value="{{ produto.nome }}" placeholder="Nome do produto" required>
            </div>

            <div class="form-group">
              <label for="precoInput">Preço</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">R$</span>
                </div>
                <input type="text" class="form-control" id="precoInput" name="preco" value="{{ produto.preco }}" placeholder="0,00" required>
              </div>
            </div>

            <div class="form-group">
              <label for="qtdeInput">Quantidade</label>
              <input type="number" class="form-control" id="qtdeInput" name="qtde" value="{{ produto.qtde }}" min="0" required>
            </div>
          </div>


          <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>

            <form action="{% url 'url_produtos' %}" method="GET" class="mb-0">
              <button type="submit" class="btn btn-outline-secondary">Cancelar</button>
            </form>
          </div>

        </form>
      </div>

    </div>
  </div>
</body>

</html>
