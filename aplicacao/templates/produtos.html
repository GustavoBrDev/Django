{% load bootstrap4 %}
{% load static %}
<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produtos</title>

  <style>
    :root{
      --bg: #ffffff;
      --muted: #6c757d;
      --border: #e6e6e6;
      --surface: #f8f9fa;
      --text: #212529;
      --primary: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --radius: 8px;
      --gap: 8px;
      --btn-font-size: 0.875rem;
    }

    /* Reset / base */
    * { box-sizing: border-box; }
    html,body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.4; }
    a { color: inherit; text-decoration: none; }

    /* Container for the table (responsive) */
    .table-responsive {
      width: 100%;
      max-width: 1100px;
      margin: 18px auto;
      padding: 16px;
      overflow-x: auto; /* permite rolar horizontalmente em telas pequenas */
      background: transparent;
    }

    /* Table */
    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px; /* força scroll em telas muito pequenas */
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .table thead th {
      text-align: left;
      font-weight: 600;
      padding: 12px 16px;
      background: var(--surface);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .table tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .table tbody tr:last-child td {
      border-bottom: 0;
    }

    /* hover */
    .table-hover tbody tr:hover {
      background: #fbfbfc;
    }

    /* bordered look */
    .table-bordered th,
    .table-bordered td {
      border-right: 1px solid var(--border);
    }
    .table-bordered th:last-child,
    .table-bordered td:last-child {
      border-right: 0;
    }

    /* Column alignment helpers */
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .align-middle { vertical-align: middle; }

    /* Product title and price */
    .product-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: #343a40;
      margin: 0;
    }

    .price {
      font-weight: 700;
      color: var(--success);
      font-size: 1rem;
    }

    /* Actions (botões) */
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 6px;
      border: 4px solid transparent;
      cursor: pointer;
      margin: 4px;
      font-size: var(--btn-font-size);
      line-height: 1;
      transition: background .12s ease, transform .06s ease, box-shadow .12s ease;
      text-decoration: none;
      color: #fff;
      background: var(--primary);
      box-shadow: none;
    }

    .btn:active { transform: translateY(1px); }
    .btn:focus { outline: 0; box-shadow: 0 0 0 3px rgba(0,123,255,0.12); }

    .btn-sm { padding: 5px 8px; font-size: 0.82rem; border-radius: 6px; }

    .btn-primary { background: var(--primary); border-color: rgba(0,0,0,0.06); }
    .btn-success { background: var(--success); border-color: rgba(0,0,0,0.06); }
    .btn-outline-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(220,53,69,0.16);
    }
    .btn-outline-danger:hover { background: rgba(220,53,69,0.04); }

    .btn + .btn { margin-left: 4px; }

    /* Formularios inline (caso existam mais tarde) */
    form { margin: 0; }

    /* Alerta */
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: var(--muted);
      max-width: 1100px;
      margin: 18px auto;
    }

    /* Botão novo produto fixado abaixo (mantive sua posição simples) */
    #newProduct {
      display: inline-block;
      margin: 16px auto 36px;
      margin-left: 16px;
      border-radius: 6px;
    }

    /* responsividade: reduz espaçamentos em telas pequenas */
    @media (max-width: 720px) {
      .table { min-width: 520px; }
      .table thead th, .table tbody td { padding: 10px 12px; }
      .product-title { font-size: 1rem; }
      .price { font-size: 0.95rem; }
      .actions { gap: 6px; }
    }

    @media (max-width: 420px) {
      .table { min-width: 420px; }
      .product-title { font-size: 0.98rem; }
      .btn { padding: 5px 8px; font-size: 0.78rem; }
    }
  </style>
</head>

<body>
  <div class="table-responsive">
    {% if produtos %}
    <table class="table table-hover table-bordered mb-0">
      <thead class="thead-light">
        <tr>
          <th scope="col">Nome</th>
          <th scope="col" class="text-center">Preço</th>
          <th scope="col" class="text-center" style="width: 160px;">Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for produto in produtos %}
        <tr>
          <td class="align-middle">
            <div class="product-title">{{ produto.nome }}</div>
          </td>
          <td class="align-middle text-right">
            <div class="price">R$ {{ produto.preco|floatformat:2 }}</div>
          </td>
          <td class="align-middle text-center actions">
            <div>
              <form action="{% url 'url_editar_produto' produto.id %}" method="get" class="d-inline">
                <button type="submit" class="btn btn-sm btn-primary" title="Editar {{ produto.nome }}">Editar</button>
              </form>
              <form action="{% url 'url_deletar_produto' produto.id %}" method="get" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                  title="Deletar {{ produto.nome }}">Deletar</button>
              </form>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <div class="alert alert-info mb-0">Nenhum produto encontrado.</div>
    {% endif %}
  </div>

  <form action="{% url 'url_cadastrar_produto' %}" method="get" class="ju">
    <button type="submit" name="Novo produto" id="newProduct" class="btn btn-success">Novo Produto</button>
  </form>
</body>

</html>
