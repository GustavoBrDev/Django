<!DOCTYPE html>
<html>
<head>
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Produtos</h1>
    <p>Os melhores produtos do mercado, venha aproveitar!</p>
    <hr>

    <div>
        {% for produto in produtos %}
            <div>
                <h1>Nome do produto: {{ produto.nome }}</h1>
            </div>
        {% endfor %}
    </div>
</body>
</html>
