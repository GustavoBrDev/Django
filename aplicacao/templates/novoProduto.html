{% load bootstrap4 %}
{% load static %}
<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Novo Produto</title>

  <!-- Bootstrap 4 CDN (opcional) -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    :root{
      --bg: #f6f8fb;
      --card: #ffffff;
      --muted: #6c757d;
      --accent: #0d6efd;
      --max-w: 720px;
      --radius: 12px;
    }

    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,#fbfdff,#f6f8fb);color:#222}

    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}

    .card-new{width:100%;max-width:var(--max-w);background:var(--card);border-radius:var(--radius);box-shadow:0 10px 30px rgba(16,24,40,0.06);border:1px solid rgba(16,24,40,0.04);overflow:hidden}

    .card-header{padding:1.25rem 1.5rem;background:linear-gradient(90deg,#fff,#fbfdff);display:flex;align-items:center;justify-content:space-between}
    .heading{font-weight:700;font-size:1.125rem}
    .sub{color:var(--muted);font-size:0.9rem}

    .card-body{padding:1.25rem 1.5rem}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .form-group{margin-bottom:0.75rem}
    label{font-weight:600}

    .form-control{border-radius:8px;padding:.6rem .75rem}

    .input-group .input-group-text{border-radius:8px}

    .actions{display:flex;gap:.75rem;margin-top:1rem;align-items:center}
    .btn-primary{min-width:140px;border-radius:10px}
    .btn-secondary{border-radius:10px}

    .note{color:var(--muted);font-size:0.9rem;margin-top:.5rem}

    @media (max-width:720px){
      .form-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card-new">
      <div class="card-header">
        <div>
          <div class="heading">Cadastrar novo produto</div>
          <div class="sub">Preencha os dados e clique em cadastrar.</div>
        </div>
      </div>

      <div class="card-body">
        <form action="{% url 'url_cadastrar_produto' %}" method="post" class="mb-0">
          {% csrf_token %}

          <div class="form-grid">
            <div class="form-group">
              <label for="nameInput">Nome</label>
              <input type="text" class="form-control" id="nameInput" name="nome" placeholder="Digite o nome do produto" required>
            </div>

            <div class="form-group">
              <label for="precoInput">Preço</label>
              <div class="input-group">
                <div class="input-group-prepend"><span class="input-group-text">R$</span></div>
                <input type="text" class="form-control" id="precoInput" name="preco" placeholder="0,00" required>
              </div>
            </div>

            <div class="form-group">
              <label for="qtdeInput">Quantidade</label>
              <input type="number" class="form-control" id="qtdeInput" name="qtde" placeholder="Digite a quantidade" min="0" required>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Cadastrar</button>

            <a href="{% url 'url_produtos' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
